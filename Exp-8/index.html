<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Collection Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .form-section {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .form-section h2 {
            margin-bottom: 15px;
            color: #34495e;
        }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }
        .form-group label {
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-add {
            background-color: #27ae60;
            color: white;
            height: 40px;
        }
        .btn-add:hover {
            background-color: #219a52;
        }
        .btn-edit {
            background-color: #f39c12;
            color: white;
            padding: 6px 14px;
            font-size: 13px;
        }
        .btn-edit:hover {
            background-color: #e08e0b;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            padding: 6px 14px;
            font-size: 13px;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        .btn-cancel {
            background-color: #95a5a6;
            color: white;
            height: 40px;
        }
        .btn-cancel:hover {
            background-color: #7f8c8d;
        }
        .btn-update {
            background-color: #2980b9;
            color: white;
            height: 40px;
        }
        .btn-update:hover {
            background-color: #2471a3;
        }
        .books-section {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .books-section h2 {
            margin-bottom: 15px;
            color: #34495e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background-color: #2c3e50;
            color: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        tbody tr:hover {
            background-color: #eaf2f8;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .no-books {
            text-align: center;
            padding: 20px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Book Collection Manager</h1>
        <div class="form-section">
            <h2 id="form-title">Add a New Book</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Enter book title">
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" placeholder="Enter author name">
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="e.g. 2023">
                </div>
                <div id="form-buttons">
                    <button class="btn btn-add" onclick="addBook()">Add Book</button>
                </div>
            </div>
        </div>
        <div class="books-section">
            <h2>All Books</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="books-table">
                    <tr><td>1</td><td>The Great Gatsby</td><td>F. Scott Fitzgerald</td><td>1925</td><td class="actions"><button class="btn btn-edit">Edit</button><button class="btn btn-delete">Delete</button></td></tr>
                    <tr><td>2</td><td>To Kill a Mockingbird</td><td>Harper Lee</td><td>1960</td><td class="actions"><button class="btn btn-edit">Edit</button><button class="btn btn-delete">Delete</button></td></tr>
                    <tr><td>3</td><td>1984</td><td>George Orwell</td><td>1949</td><td class="actions"><button class="btn btn-edit">Edit</button><button class="btn btn-delete">Delete</button></td></tr>
                </tbody>
            </table>
            <p id="no-books" class="no-books" style="display:none;">No books found.</p>
        </div>
    </div>
</body>
</html>
