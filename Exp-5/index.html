<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name" value="Noida">
            <button id="getWeatherBtn">Get Weather</button>
        </div>
        <div id="error" class="error"></div>
        <div id="weatherResult" class="weather-result">
            <h2 id="cityName">Noida, IN</h2>
            <p id="temperature">Temperature: 24 °C</p>
            <p id="description">Weather: Clear sky</p>
            <p id="humidity">Humidity: 58%</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
